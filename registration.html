
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Team Manager | Banty Moore Prestige Cup</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div class="wrap">
      <div class="brand">
        <img src="banty-moore-logo.jpg" alt="Banty Moore logo">
        <div class="brand-copy">
          <h1>Team Manager</h1>
          <p>Banty Moore Prestige Cup</p>
          <small>Official team roster</small>
        </div>
      </div>
      <nav><a href="index.html">Home</a></nav>
    </div>
  </header>

  <main>
    <section class="panel">
      <h2 id="teamName">Loading team...</h2>
      <p>View your registered players and their approval status.</p>
      <div id="notice" class="notice" hidden></div>

      <div id="roster">
        <p>Loading roster...</p>
      </div>

      <button class="button" id="refreshRoster" type="button">
        Refresh roster
      </button>
      <p class="muted">
        Keep your team's private manager link secure.
        Player approval is handled by the tournament admin.
      </p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="supabase-client.js"></script>
  <script src="shared.js"></script>
  <script src="registration.js"></script>
</body>
</html>
